name: Sincronizar fork DeskcommCRM

on:
  schedule:
    # A cada 3 dias (dias 1, 4, 7... do mes), 09:41 UTC. Minuto fora da hora
    # cheia para fugir do pico do agendador do GitHub.
    - cron: '41 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-deskcomm-main
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.repository == 'DoanCasotti/automacoes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Atualizar main do fork sem sobrescrever commits
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SSH_KEY: ${{ secrets.DESKCOMM_SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SYNC_SSH_KEY" ]]; then
            echo "::error::Secret DESKCOMM_SYNC_SSH_KEY ausente."
            exit 1
          fi
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$SYNC_SSH_KEY" > "$work/key"
          unset SYNC_SSH_KEY
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$work/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $work/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/known_hosts"
          git init --bare "$work/repo.git"
          cd "$work/repo.git"
          git fetch --no-tags https://github.com/melgarafael/DeskcommCRM.git main:refs/heads/original
          git fetch --no-tags git@github.com:DoanCasotti/DeskcommCRM.git main:refs/heads/fork
          source_sha=$(git rev-parse refs/heads/original)
          fork_sha=$(git rev-parse refs/heads/fork)
          if [[ "$source_sha" == "$fork_sha" ]]; then
            echo "Fork ja atualizado: $source_sha"
          elif git merge-base --is-ancestor refs/heads/fork refs/heads/original; then
            git push git@github.com:DoanCasotti/DeskcommCRM.git refs/heads/original:refs/heads/main
            echo "Fork atualizado: $source_sha"
          else
            echo "::error::A main do fork possui commits proprios ou o original mudou o historico. Sincronizacao interrompida para preservar seu trabalho."
            exit 1
          fi
          git fetch --no-tags --force git@github.com:DoanCasotti/DeskcommCRM.git main:refs/heads/verificacao
          synced_sha=$(git rev-parse refs/heads/verificacao)
          if [[ "$synced_sha" != "$source_sha" ]]; then
            echo "::error::O push terminou, mas a main do fork ficou em $synced_sha; esperado: $source_sha."
            exit 1
          fi
          echo "Fork confirmado no SHA do original: $synced_sha"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Registrar versao sincronizada
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SHA: ${{ steps.sync.outputs.sha }}
        run: |
          import base64, json, os, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          repo = os.environ['GITHUB_REPOSITORY']
          api = 'https://api.github.com/repos/' + repo
          url = api + '/contents/status/deskcomm.json'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=headers), timeout=30) as response:
                  return json.load(response)
          now = datetime.now(timezone.utc)
          state = {'source': 'melgarafael/DeskcommCRM', 'fork': 'DoanCasotti/DeskcommCRM', 'branch': 'main', 'sha': os.environ['SYNC_SHA'], 'verificado_em': now.strftime('%Y-%m-%dT%H:%M:%SZ')}
          existing = None
          try:
              existing = get(url)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          motivo = None
          if not existing:
              motivo = 'registrar fork sincronizado ' + state['sha'][:12]
          else:
              anterior = json.loads(base64.b64decode(existing['content']))
              if anterior.get('sha') != state['sha']:
                  motivo = 'registrar fork sincronizado ' + state['sha'][:12]
              else:
                  # O GitHub desativa o schedule de repositorio publico apos 60 dias
                  # sem commit. Se o original ficar parado, um commit mensal de
                  # manutencao mantem o agendamento vivo.
                  ultimo = get(api + '/commits?path=status/deskcomm.json&per_page=1')[0]['commit']['committer']['date']
                  if now - datetime.fromisoformat(ultimo.replace('Z', '+00:00')) > timedelta(days=30):
                      motivo = 'manter agendamento ativo (fork em ' + state['sha'][:12] + ')'
          if not motivo:
              print('Estado registrado ja corresponde ao fork; nenhum commit necessario.')
          else:
              content = (json.dumps(state, indent=2) + '\n').encode()
              body = {'message': 'chore: ' + motivo, 'content': base64.b64encode(content).decode()}
              if existing:
                  body['sha'] = existing['sha']
              with urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers, method='PUT'), timeout=30) as response:
                  json.load(response)
              print('Estado da sincronizacao registrado: ' + motivo)
