name: Sincronizar fork DeskcommCRM

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-deskcomm-main
  cancel-in-progress: false

jobs:
  sincronizar:
    if: github.repository == 'DoanCasotti/automacoes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Atualizar main do fork sem sobrescrever commits
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SSH_KEY: ${{ secrets.DESKCOMM_SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SYNC_SSH_KEY" ]]; then
            echo "::error::Secret DESKCOMM_SYNC_SSH_KEY ausente."
            exit 1
          fi
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$SYNC_SSH_KEY" > "$work/key"
          unset SYNC_SSH_KEY
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$work/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $work/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/known_hosts"
          git init --bare "$work/repo.git"
          cd "$work/repo.git"
          git fetch --no-tags https://github.com/melgarafael/DeskcommCRM.git main:refs/heads/original
          git fetch --no-tags git@github.com:DoanCasotti/DeskcommCRM.git main:refs/heads/fork
          source_sha=$(git rev-parse refs/heads/original)
          fork_sha=$(git rev-parse refs/heads/fork)
          if [[ "$source_sha" == "$fork_sha" ]]; then
            echo "Fork ja atualizado: $source_sha"
          elif git merge-base --is-ancestor refs/heads/fork refs/heads/original; then
            git push git@github.com:DoanCasotti/DeskcommCRM.git refs/heads/original:refs/heads/main
            echo "Fork atualizado: $source_sha"
          else
            echo "::error::A main do fork possui commits proprios ou o original mudou o historico. Sincronizacao interrompida para preservar seu trabalho."
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Registrar versao sincronizada
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SHA: ${{ steps.sync.outputs.sha }}
        run: |
          import base64, json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          url = 'https://api.github.com/repos/' + repo + '/contents/status/deskcomm.json'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          state = {'source': 'melgarafael/DeskcommCRM', 'fork': 'DoanCasotti/DeskcommCRM', 'branch': 'main', 'sha': os.environ['SYNC_SHA']}
          content = (json.dumps(state, indent=2) + '\n').encode()
          existing = None
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          if existing and base64.b64decode(existing['content']) == content:
              print('Estado registrado ja corresponde ao fork; nenhum commit necessario.')
          else:
              body = {'message': 'chore: registrar fork sincronizado ' + state['sha'][:12], 'content': base64.b64encode(content).decode()}
              if existing:
                  body['sha'] = existing['sha']
              with urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers, method='PUT'), timeout=30) as response:
                  json.load(response)
              print('Estado da sincronizacao registrado.')
